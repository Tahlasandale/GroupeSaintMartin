<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carnet de Chants</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-color: #f5f0e6;
      --page-bg: #fffef8;
      --text-color: #2c2c2c;
      --border-color: #8b7355;
      --accent-color: #6b5344;
    }

    body {
      font-family: 'Georgia', serif;
      background: var(--bg-color);
      color: var(--text-color);
      line-height: 1.4;
      padding: 20px;
    }

    .book {
      max-width: 900px;
      margin: 0 auto;
      background: var(--page-bg);
      box-shadow: 
        0 0 0 1px var(--border-color),
        0 10px 30px rgba(0,0,0,0.2);
      padding: 40px;
      min-height: 100vh;
    }

    .page {
      display: block;
      column-count: 2;
      column-gap: 40px;
    }

    .page.active {
      display: block;
    }

    .page-header {
      text-align: center;
      margin-bottom: 30px;
      padding-bottom: 20px;
      border-bottom: 2px solid var(--border-color);
    }

    .page-header h1 {
      font-size: 28px;
      color: var(--accent-color);
      font-weight: bold;
      letter-spacing: 2px;
    }

    .song-item {
      break-inside: avoid;
      margin-bottom: 30px;
      padding: 15px;
      border: 1px solid #ddd;
      background: #fafafa;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .song-item:hover {
      background: #f0e8d8;
      border-color: var(--border-color);
      transform: translateY(-2px);
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }

    .song-title {
      font-size: 14px;
      font-weight: bold;
      color: var(--accent-color);
      margin-bottom: 8px;
    }

    .song-preview {
      font-size: 11px;
      color: #666;
      white-space: pre-line;
      max-height: 60px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .song-meta {
      display: flex;
      gap: 10px;
      margin-top: 8px;
      font-size: 10px;
    }

    .song-meta span {
      background: var(--border-color);
      color: white;
      padding: 2px 8px;
      border-radius: 3px;
    }

    .pagination {
      display: none;
    }

    .pagination button {
      background: var(--accent-color);
      color: white;
      border: none;
      padding: 10px 20px;
      cursor: pointer;
      font-family: 'Georgia', serif;
      font-size: 14px;
      border-radius: 4px;
      transition: background 0.2s;
    }

    .pagination button:hover:not(:disabled) {
      background: #8b7355;
    }

    .pagination button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    /* Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.7);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal {
      background: var(--page-bg);
      max-width: 700px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      padding: 40px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.3);
      border-radius: 4px;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 30px;
      padding-bottom: 20px;
      border-bottom: 2px solid var(--border-color);
    }

    .modal-title {
      font-size: 24px;
      color: var(--accent-color);
      font-weight: bold;
    }

    .modal-close {
      background: none;
      border: none;
      font-size: 28px;
      cursor: pointer;
      color: #999;
      line-height: 1;
    }

    .modal-close:hover {
      color: var(--accent-color);
    }

    .modal-meta {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .modal-meta span {
      background: var(--border-color);
      color: white;
      padding: 4px 12px;
      font-size: 12px;
      border-radius: 3px;
    }

    .modal-lyrics {
      white-space: pre-line;
      font-size: 14px;
      line-height: 1.8;
      padding: 20px;
      background: #fafafa;
      border-left: 4px solid var(--border-color);
    }

    /* Index */
    .index {
      display: none;
    }

    .index.active {
      display: block;
    }

    .index-list {
      column-count: 3;
      column-gap: 30px;
    }

    .index-item {
      padding: 10px;
      border-bottom: 1px solid #ddd;
      cursor: pointer;
    }

    .index-item:hover {
      background: #f0e8d8;
    }

    .nav-tabs {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 30px;
    }

    .nav-tabs button {
      background: transparent;
      border: 2px solid var(--border-color);
      padding: 10px 30px;
      cursor: pointer;
      font-family: 'Georgia', serif;
      font-size: 14px;
      color: var(--accent-color);
      border-radius: 4px;
      transition: all 0.2s;
    }

    .nav-tabs button.active {
      background: var(--accent-color);
      color: white;
      border-color: var(--accent-color);
    }

    /* Search and Filter */
    .search-container {
      margin-bottom: 20px;
      text-align: center;
    }

    .search-input {
      width: 100%;
      max-width: 400px;
      padding: 12px 20px;
      font-size: 16px;
      font-family: 'Georgia', serif;
      border: 2px solid var(--border-color);
      border-radius: 4px;
      background: var(--page-bg);
      color: var(--text-color);
    }

    .search-input:focus {
      outline: none;
      border-color: var(--accent-color);
    }

    .alphabet-filter {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 5px;
      margin: 15px 0;
    }

    .alphabet-filter button {
      background: transparent;
      border: 1px solid var(--border-color);
      width: 32px;
      height: 32px;
      cursor: pointer;
      font-family: 'Georgia', serif;
      font-size: 14px;
      color: var(--accent-color);
      border-radius: 3px;
      transition: all 0.2s;
    }

    .alphabet-filter button:hover,
    .alphabet-filter button.active {
      background: var(--accent-color);
      color: white;
      border-color: var(--accent-color);
    }

    .alphabet-filter button.clear {
      width: auto;
      padding: 0 15px;
    }

    .results-info {
      text-align: center;
      margin-bottom: 15px;
      font-size: 14px;
      color: var(--accent-color);
      font-style: italic;
    }

    /* Song actions */
    .song-actions {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .song-actions button {
      flex: 1;
      padding: 6px 12px;
      font-size: 12px;
      border: none;
      border-radius: 3px;
      cursor: pointer;
      font-family: 'Georgia', serif;
      transition: all 0.2s;
    }

    .song-actions .edit-btn {
      background: var(--accent-color);
      color: white;
    }

    .song-actions .edit-btn:hover {
      background: #8b7355;
    }

    .song-actions .delete-btn {
      background: #c0392b;
      color: white;
    }

    .song-actions .delete-btn:hover {
      background: #e74c3c;
    }

    /* Edit Modal */
    .edit-modal .modal {
      max-width: 800px;
    }

    .edit-form {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .edit-form label {
      font-weight: bold;
      color: var(--accent-color);
    }

    .edit-form input,
    .edit-form textarea {
      padding: 10px;
      font-size: 14px;
      font-family: 'Georgia', serif;
      border: 2px solid var(--border-color);
      border-radius: 4px;
      background: var(--page-bg);
    }

    .edit-form textarea {
      min-height: 300px;
      white-space: pre-wrap;
    }

    .edit-form select {
      padding: 10px;
      font-size: 14px;
      font-family: 'Georgia', serif;
      border: 2px solid var(--border-color);
      border-radius: 4px;
      background: var(--page-bg);
    }

    .form-row {
      display: flex;
      gap: 15px;
    }

    .form-row > div {
      flex: 1;
    }

    .form-buttons {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 10px;
    }

    .form-buttons button {
      padding: 10px 20px;
      font-size: 14px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-family: 'Georgia', serif;
    }

    .form-buttons .save-btn {
      background: #27ae60;
      color: white;
    }

    .form-buttons .cancel-btn {
      background: #95a5a6;
      color: white;
    }

    .export-btn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: var(--accent-color);
      color: white;
      border: none;
      padding: 15px 25px;
      font-size: 14px;
      font-family: 'Georgia', serif;
      border-radius: 4px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      transition: background 0.2s;
    }

    .export-btn:hover {
      background: #8b7355;
    }

    /* Confirm Modal */
    .confirm-modal .modal {
      max-width: 400px;
      text-align: center;
    }

    .confirm-modal .modal-body {
      padding: 20px 0;
    }

    .confirm-modal .confirm-buttons {
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    .confirm-modal .confirm-btn {
      padding: 10px 30px;
      font-size: 14px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-family: 'Georgia', serif;
    }

    .confirm-modal .confirm-yes {
      background: #c0392b;
      color: white;
    }

    .confirm-modal .confirm-no {
      background: #95a5a6;
      color: white;
    }

    @media (max-width: 768px) {
      .book {
        padding: 20px;
      }
      
      .page {
        column-count: 1;
      }
      
      .index-list {
        column-count: 2;
      }
      
      .modal {
        padding: 20px;
      }
    }
  </style>
</head>
<body>
  <div class="book">
    <div class="page-header">
      <h1>Carnet de Chants</h1>
    </div>
    
    <div class="nav-tabs">
      <button class="active" onclick="showView('pages')">Pages</button>
      <button onclick="showView('index')">Index</button>
    </div>

    <div class="search-container">
      <input type="text" class="search-input" id="search-input" placeholder="Rechercher un chant..." oninput="filterSongs()">
      <div class="alphabet-filter" id="alphabet-filter"></div>
      <div class="results-info" id="results-info"></div>
    </div>

    <div id="pages-view">
      <div class="page active" id="page-1"></div>
    </div>

    <div class="index" id="index-view">
      <div class="index-list" id="index-list"></div>
    </div>

    </div>
  </div>

  <!-- Modal -->
  <div class="modal-overlay" id="modal">
    <div class="modal">
      <div class="modal-header">
        <h2 class="modal-title" id="modal-title"></h2>
        <button class="modal-close" onclick="closeModal()">×</button>
      </div>
      <div class="modal-meta" id="modal-meta"></div>
      <div class="modal-lyrics" id="modal-lyrics"></div>
    </div>
  </div>

  <!-- Edit Modal -->
  <div class="modal-overlay edit-modal" id="edit-modal">
    <div class="modal">
      <div class="modal-header">
        <h2 class="modal-title">Modifier le chant</h2>
        <button class="modal-close" onclick="closeEditModal()">×</button>
      </div>
      <form class="edit-form" id="edit-form">
        <div>
          <label for="edit-titre">Titre</label>
          <input type="text" id="edit-titre" name="titre" required>
        </div>
        <div class="form-row">
          <div>
            <label for="edit-branche">Branche</label>
            <select id="edit-branche" name="branche">
              <option value="LL">LL (Louveteaux)</option>
              <option value="SG">SG (Scouts)</option>
              <option value="RGA">RGA (Route)</option>
              <option value="GI">GI (Guidettes)</option>
            </select>
          </div>
          <div>
            <label for="edit-ambiance">Ambiance</label>
            <select id="edit-ambiance" name="ambiance">
              <option value="veillée">Veillée</option>
              <option value="marche">Marche</option>
              <option value="prière">Prière</option>
              <option value="celebration">Célébration</option>
            </select>
          </div>
        </div>
        <div>
          <label for="edit-paroles">Paroles</label>
          <textarea id="edit-paroles" name="paroles" rows="20"></textarea>
        </div>
        <div class="form-buttons">
          <button type="button" class="cancel-btn" onclick="closeEditModal()">Annuler</button>
          <button type="submit" class="save-btn">Enregistrer</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Confirm Delete Modal -->
  <div class="modal-overlay confirm-modal" id="confirm-modal">
    <div class="modal">
      <div class="modal-header">
        <h2 class="modal-title">Confirmer la suppression</h2>
        <button class="modal-close" onclick="closeConfirmModal()">×</button>
      </div>
      <div class="modal-body">
        <p>Êtes-vous sûr de vouloir supprimer le chant "<span id="confirm-titre"></span>" ?</p>
        <p style="color: #c0392b; margin-top: 10px;">Cette action est irréversible.</p>
      </div>
      <div class="confirm-buttons">
        <button class="confirm-no" onclick="closeConfirmModal()">Annuler</button>
        <button class="confirm-yes" onclick="confirmDelete()">Supprimer</button>
      </div>
    </div>
  </div>

  <script>
    let songs = [];
    let filteredSongs = [];
    let currentLetter = '';
    const songsPerPage = 10;

    // Load data
    async function loadSongs() {
      try {
        // Always load from JSON first
        const response = await fetch('Data/songs.json');
        songs = await response.json();
        console.log('Loaded from JSON:', songs.length, 'songs');
        
        // Check if there are saved changes in localStorage
        const stored = localStorage.getItem('songs');
        if (stored && stored.length > 2) {
          const saved = JSON.parse(stored);
          if (saved.length > 0) {
            songs = saved;
            console.log('Using saved changes from localStorage:', songs.length, 'songs');
          }
        }
        
        filteredSongs = [...songs];
        console.log('filteredSongs initialized:', filteredSongs.length);
        initBook();
        initAlphabet();
      } catch (e) {
        console.error('Erreur chargement:', e);
      }
    }

    function initBook() {
      renderPages();
      renderIndex();
    }

    function initAlphabet() {
      const alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
      const container = document.getElementById('alphabet-filter');
      
      const clearBtn = document.createElement('button');
      clearBtn.className = 'clear';
      clearBtn.textContent = 'Tous';
      clearBtn.onclick = () => filterByLetter('');
      container.appendChild(clearBtn);
      
      alphabet.forEach(letter => {
        const btn = document.createElement('button');
        btn.textContent = letter;
        btn.onclick = () => filterByLetter(letter);
        btn.id = 'letter-' + letter;
        container.appendChild(btn);
      });
    }

    function filterByLetter(letter) {
      currentLetter = letter;
      document.querySelectorAll('.alphabet-filter button').forEach(btn => btn.classList.remove('active'));
      if (letter) {
        document.getElementById('letter-' + letter).classList.add('active');
      } else {
        document.querySelector('.alphabet-filter .clear').classList.add('active');
      }
      applyFilters();
    }

    function filterSongs() {
      applyFilters();
    }

    function applyFilters() {
      const searchTerm = document.getElementById('search-input').value.toLowerCase();
      
      filteredSongs = songs.filter(song => {
        const matchesSearch = !searchTerm || 
          song.titre.toLowerCase().includes(searchTerm) ||
          song.paroles.toLowerCase().includes(searchTerm);
        
        const matchesLetter = !currentLetter || 
          song.titre.toUpperCase().startsWith(currentLetter);
        
        return matchesSearch && matchesLetter;
      });
      
      renderPages();
      renderIndex();
      
      const info = document.getElementById('results-info');
      if (searchTerm || currentLetter) {
        info.textContent = `${filteredSongs.length} chant(s) trouvé(s)`;
      } else {
        info.textContent = '';
      }
    }

    function renderPages() {
      const pagesContainer = document.getElementById('pages-view');
      pagesContainer.innerHTML = '';
      
      if (filteredSongs.length === 0) {
        const empty = document.createElement('div');
        empty.style.textAlign = 'center';
        empty.style.padding = '40px';
        empty.style.color = '#999';
        empty.textContent = 'Aucun chant trouvé';
        pagesContainer.appendChild(empty);
        return;
      }

      // Single page with all songs
      const page = document.createElement('div');
      page.className = 'page active';
      page.id = 'page-1';

      filteredSongs.forEach((song, index) => {
        const songItem = document.createElement('div');
        songItem.className = 'song-item';
        
        const globalIndex = songs.indexOf(song);
        songItem.onclick = () => openModal(globalIndex);

        const preview = song.paroles.split('\n').slice(0, 6).join('\n');

        songItem.innerHTML = `
          <div class="song-title">${song.titre}</div>
          <div class="song-preview">${preview}</div>
          <div class="song-meta">
            <span>${song.branche}</span>
            <span>${song.ambiance}</span>
          </div>
          <div class="song-actions">
            <button class="edit-btn" onclick="event.stopPropagation(); openEditModal(${globalIndex})">Modifier</button>
            <button class="delete-btn" onclick="event.stopPropagation(); openConfirmModal(${globalIndex})">Supprimer</button>
          </div>
        `;
        page.appendChild(songItem);
      });

      pagesContainer.appendChild(page);
    }

    function renderIndex() {
      const indexList = document.getElementById('index-list');
      indexList.innerHTML = '';

      filteredSongs.forEach((song, index) => {
        const item = document.createElement('div');
        item.className = 'index-item';
        item.innerHTML = `<strong>${song.titre}</strong> - ${song.branche}`;
        
        const globalIndex = songs.indexOf(song);
        item.onclick = () => openModal(globalIndex);
        indexList.appendChild(item);
      });
    }

    function showView(view) {
      document.querySelectorAll('.nav-tabs button').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');

      if (view === 'pages') {
        document.getElementById('pages-view').classList.add('active');
        document.getElementById('index-view').classList.remove('active');
      } else {
        document.getElementById('pages-view').classList.remove('active');
        document.getElementById('index-view').classList.add('active');
      }
    }

    let songToDeleteIndex = null;

    function openModal(songIndex) {
      const song = songs[songIndex];
      document.getElementById('modal-title').textContent = song.titre;
      document.getElementById('modal-meta').innerHTML = `
        <span>${song.branche}</span>
        <span>${song.ambiance}</span>
      `;
      document.getElementById('modal-lyrics').textContent = song.paroles;
      document.getElementById('modal').classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      document.getElementById('modal').classList.remove('active');
      document.body.style.overflow = '';
    }

    function openEditModal(songIndex) {
      const song = songs[songIndex];
      document.getElementById('edit-titre').value = song.titre;
      document.getElementById('edit-branche').value = song.branche;
      document.getElementById('edit-ambiance').value = song.ambiance;
      document.getElementById('edit-paroles').value = song.paroles;
      
      document.getElementById('edit-form').dataset.songIndex = songIndex;
      
      document.getElementById('edit-modal').classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function closeEditModal() {
      document.getElementById('edit-modal').classList.remove('active');
      document.body.style.overflow = '';
    }

    function saveSong(e) {
      e.preventDefault();
      
      const form = document.getElementById('edit-form');
      const index = parseInt(form.dataset.songIndex);
      
      const updatedSong = {
        titre: document.getElementById('edit-titre').value,
        branche: document.getElementById('edit-branche').value,
        ambiance: document.getElementById('edit-ambiance').value,
        paroles: document.getElementById('edit-paroles').value
      };
      
      songs[index] = updatedSong;
      localStorage.setItem('songs', JSON.stringify(songs));
      
      filteredSongs = [...songs];
      applyFiltersFromUI();
      
      closeEditModal();
      renderPages();
      renderIndex();
      
      alert('Chant enregistré avec succès !');
    }

    function applyFiltersFromUI() {
      const searchTerm = document.getElementById('search-input').value.toLowerCase();
      
      filteredSongs = songs.filter(song => {
        const matchesSearch = !searchTerm || 
          song.titre.toLowerCase().includes(searchTerm) ||
          song.paroles.toLowerCase().includes(searchTerm);
        
        const matchesLetter = !currentLetter || 
          song.titre.toUpperCase().startsWith(currentLetter);
        
        return matchesSearch && matchesLetter;
      });
    }

    function openConfirmModal(songIndex) {
      songToDeleteIndex = songIndex;
      document.getElementById('confirm-titre').textContent = songs[songIndex].titre;
      document.getElementById('confirm-modal').classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function closeConfirmModal() {
      document.getElementById('confirm-modal').classList.remove('active');
      document.body.style.overflow = '';
      songToDeleteIndex = null;
    }

    function confirmDelete() {
      if (songToDeleteIndex !== null) {
        songs.splice(songToDeleteIndex, 1);
        localStorage.setItem('songs', JSON.stringify(songs));
        
        filteredSongs = [...songs];
        applyFiltersFromUI();
        
        renderPages();
        renderIndex();
      }
      closeConfirmModal();
    }

    document.getElementById('edit-form').addEventListener('submit', saveSong);

    document.getElementById('modal').addEventListener('click', function(e) {
      if (e.target === this) closeModal();
    });

    document.getElementById('edit-modal').addEventListener('click', function(e) {
      if (e.target === this) closeEditModal();
    });

    document.getElementById('confirm-modal').addEventListener('click', function(e) {
      if (e.target === this) closeConfirmModal();
    });

    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') {
        closeModal();
        closeEditModal();
        closeConfirmModal();
      }
    });

    function exportSongs() {
      const dataStr = JSON.stringify(songs, null, 2);
      const blob = new Blob([dataStr], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'songs.json';
      a.click();
      URL.revokeObjectURL(url);
    }

    loadSongs();
  </script>
</body>
</html>
